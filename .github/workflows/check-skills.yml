name: Check Skills

# Проверяет навыки: блоки правил совпадают с llms.txt (sync_rules.py --check) и каждый
# навык соответствует стандарту Agent Skills и правилам репозитория (validate_skills.py).
# Публикацией не управляет.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Правила в навыках совпадают с llms.txt
        run: python3 scripts/sync_rules.py --check

      - name: Навыки соответствуют стандарту
        run: python3 scripts/validate_skills.py
