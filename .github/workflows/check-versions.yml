name: Check Versions

# На PR: проверяет согласованность версий (SKILL.md, plugin.json, marketplace.json,
# VERSIONS.md), лимиты описаний и что PR, меняющий файлы навыка, поднимает версию.
# Публикацией не управляет — релизы собирает release.yml на main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "skills/**"
      - "VERSIONS.md"
      - ".claude-plugin/**"
      - "packaging/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: check-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить версии навыка и репозитория
        run: python3 scripts/check_versions.py --base "origin/${{ github.base_ref }}"

      - name: Собрать архивы (без публикации)
        run: python3 scripts/package_skill.py --output dist
