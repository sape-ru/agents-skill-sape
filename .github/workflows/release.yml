name: Release on version bump

# Автоматически ставит git-тег и создаёт GitHub Release, когда версия из
# .claude-plugin/plugin.json меняется на main. Заметки релиза берутся из
# соответствующего раздела `### x.y.z (дата)` в VERSIONS.md. Повторные запуски
# не двигают существующий тег — пересобирают и заменяют только ZIP-архивы.
# Можно запустить и вручную (workflow_dispatch) — например, чтобы пересобрать
# архивы или пересоздать релиз после сбоя.
# Если после тега текущей версии менялись skills/ или packaging/ без бампа
# версии — запуск падает: изменения должны дойти до пользователей через релиз.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "skills/**"
      - "packaging/**"
      - "VERSIONS.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Проверить, что изменения навыка выпущены
        run: |
          VERSION=$(python3 scripts/package_skill.py --version)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            CHANGED=$(git diff --name-only "refs/tags/v$VERSION..HEAD" -- skills/ packaging/)
            if [ -n "$CHANGED" ]; then
              echo "Изменения после тега v$VERSION, не попавшие в релиз:"
              echo "$CHANGED" | sed 's/^/  - /'
              echo "::error::После тега v$VERSION менялись skills/ или packaging/, но версия не поднята — изменения не попадут к пользователям релизов. Поднимите версию в SKILL.md, plugin.json и marketplace.json и опишите её в VERSIONS.md."
              exit 1
            fi
          fi

      - name: Определить версию и проверить, есть ли уже тег
        id: ver
        run: |
          VERSION=$(python3 scripts/package_skill.py --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "package_ref=$(git rev-parse "refs/tags/v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"
            echo "v$VERSION уже отмечен — архивы собираем из коммита тега."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "package_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Взять заметки и заголовок релиза из VERSIONS.md
        run: |
          python3 - "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.package_ref }}" <<'PY'
          import re, subprocess, sys
          v = sys.argv[1]
          text = subprocess.check_output(["git", "show", f"{sys.argv[2]}:VERSIONS.md"], text=True)
          parts = re.split(r"\n### (\d+\.\d+\.\d+) \([^)]*\)\n", text)
          blocks = {}
          for i in range(1, len(parts), 2):
              blocks[parts[i]] = parts[i + 1].split("\n### ")[0].strip()
          body = blocks.get(v, f"Release {v}")
          open("release-notes.md", "w").write(body + "\n")
          # заголовок = первая непустая строка блока без разметки, с обрезкой
          first = next((l for l in body.splitlines() if l.strip()), "")
          first = re.sub(r"[*`_]|^- |\[([^\]]+)\]\([^)]+\)", r"\1", first).strip()
          title = f"v{v} — {first}"
          if len(title) > 100:
              title = title[:99].rstrip() + "…"
          open("release-title.txt", "w").write(title)
          print("Title:", title)
          PY

      - name: Собрать ZIP-архивы из коммита релиза
        run: |
          git checkout --detach "${{ steps.ver.outputs.package_ref }}"
          python3 scripts/package_skill.py --output dist
          VERSION="${{ steps.ver.outputs.version }}"
          {
            echo ""
            echo "## ZIP-архивы навыка"
            echo ""
            echo "- \`sape-links-seo-claude-web.zip\` — для загрузки в claude.ai и Claude Desktop (*Customize → Skills → Upload a skill*): то же содержимое, но с коротким описанием в пределах лимита claude.ai (200 символов)."
            echo "- \`sape-links-seo.zip\` — исходный навык без изменений для агентов со стандартом [Agent Skills](https://agentskills.io): Claude Code, Cursor, OpenAI Codex, Gemini CLI."
            echo "- Копии с версией в имени (\`sape-links-seo-$VERSION.zip\`) — когда нужна конкретная версия; копии без версии — постоянные ссылки \`releases/latest/download/...\`."
            echo ""
            echo "Установка архива не подключает Sape Links MCP и не настраивает учётные данные — см. README."
          } >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Создать релиз (если нужно) и загрузить ZIP-архивы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --target "${{ steps.ver.outputs.package_ref }}" \
              --title "$(cat release-title.txt)" \
              --notes-file release-notes.md
          fi
          gh release upload "v$VERSION" dist/*.zip --clobber
          echo "Загружены ZIP-архивы навыка для v$VERSION"
