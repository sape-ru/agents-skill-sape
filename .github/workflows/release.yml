name: Release

# На каждом PR: проверяет версии и собирает архивы (без публикации).
# На main: если версии из .claude-plugin/plugin.json ещё нет среди релизов —
# ставит тег vX.Y.Z и создаёт GitHub Release с ZIP-архивами навыка.
# Чтобы выпустить новую версию, поднимите её в SKILL.md, plugin.json и marketplace.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить версии и собрать архивы
        run: python3 scripts/package_skill.py --output dist

      - name: Создать релиз, если этой версии ещё нет
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 scripts/package_skill.py --version)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Релиз v$VERSION уже есть — пропускаю. Для нового релиза поднимите версию."
            echo "Релиз v$VERSION уже существует, новый не создан." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "v$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
          echo "Создан релиз v$VERSION." >> "$GITHUB_STEP_SUMMARY"
